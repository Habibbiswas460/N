# Adaptive Hybrid Strategy Configuration v1.0
# =====================================================
# 🎯 REGIME-BASED TRADING WITH VWAP + VOLUME PROFILE 🎯
# =====================================================

strategy:
  name: "Adaptive Hybrid Strategy"
  version: "1.0.0"
  
  # Entry parameters
  entry:
    atr_sl_multiplier: 1.0       # SL = 1x ATR (dynamic)
    min_rr_ratio: 2.0            # Minimum 1:2 Risk:Reward
    max_trades_per_day: 4        # Max trades per day (was 3)
    max_daily_loss_pct: 2.0      # Max 2% daily loss
    signal_cooldown_minutes: 3   # Wait 3 min between signals (was 5)
    min_confidence: 0.65         # Min 65% regime confidence (was 0.7)
    
  # Trading windows  
  trading_hours:
    morning_start: "09:30"       # Wait 15 min after open
    morning_end: "11:30"
    afternoon_start: "13:00"
    afternoon_end: "15:00"
    no_new_trades_after: "14:30" # No new entries after 2:30 PM
    
  # Regime detection parameters
  regime:
    atr_period: 14               # ATR calculation period
    lookback: 20                 # Candles for regime detection
    ema_fast: 8                  # Fast EMA for direction
    ema_slow: 21                 # Slow EMA for direction
    
  # VWAP settings
  vwap:
    band_multiplier: 2.0         # Upper/Lower band = VWAP ± 2σ
    bias_threshold: 2.0          # Points above/below VWAP for bias
    
  # Volume Profile settings
  volume_profile:
    tick_size: 0.5               # Price grouping for NIFTY
    value_area_pct: 0.70         # 70% value area
    
  # Trending market entry (pullback to VWAP)
  trending:
    pullback_min_pct: -0.15      # Min % below VWAP
    pullback_max_pct: 0.10       # Max % above VWAP
    
  # Sideways market entry (mean reversion)
  sideways:
    level_tolerance_atr: 0.3     # Entry within 0.3 ATR of VAH/VAL

# Index Configuration
index:
  symbol: "NIFTY"
  token: "99926000"              # NIFTY 50 Index token
  exchange: "NSE"
  exchange_type: 1               # NSE_CM

# Option Configuration
option:
  underlying: "NIFTY"
  exchange: "NFO"
  exchange_type: 2               # NSE_FO
  expiry_preference: "weekly"
  trade_direction: "BOTH"        # CE and PE both

# Strike Selection
strike_selection:
  premium_min: 85.0              # Minimum premium ₹85
  premium_max: 150.0             # Maximum premium ₹150
  premium_sweet_min: 90.0        # Sweet spot ₹90-120
  premium_sweet_max: 120.0
  strike_range: 5                # Check ±5 strikes from ATM

# Risk Management
risk:
  lot_size: 65                   # NIFTY lot = 65 qty
  num_lots: 4                    # Conservative: 4 lots
  fixed_quantity: 260            # 65 × 4
  margin_per_lot: 8000.0         # ₹8,000 margin per lot
  
  # Daily limits
  max_sl_per_day: 2              # Max 2 SL hits per day
  max_daily_loss: 4000           # Max ₹4,000 daily loss
  max_daily_loss_pct: 5.0        # Max 5% of capital
  max_trades_per_day: 4          # Max 4 trades (was 3)
  
  # Cooldown
  cooldown_candles: 15           # Wait 15 candles after trade
  
  # Capital
  paper_capital: 50000           # ₹50,000 paper trading

# Exit Rules
exit:
  # ATR-based SL (from strategy)
  use_atr_sl: true               # Use ATR-based dynamic SL
  atr_sl_multiplier: 1.0         # SL = Entry - (1 × ATR)
  
  # Trailing Stop Loss
  trailing:
    enabled: true
    safe_mode_trigger: 7.0       # At +7pt, move SL to entry+1
    safe_mode_buffer: 1.0
    trail_mode_trigger: 10.0     # At +10pt, start trailing
    trail_mode_buffer: 5.0       # TSL = High - 5pt

# Timing
timing:
  market_open: "09:15"
  market_close: "15:30"
  trading_start: "09:30"
  no_new_trades_after: "14:30"
  auto_logout: true
  logout_time: "15:35"

# Logging
logging:
  level: "INFO"
  format: "structured"
  log_dir: "logs"

# API Rate Limits (Angel One)
rate_limits:
  orders_per_second: 9
  position_poll_interval: 5
  websocket_heartbeat: 30
  market_feed_interval: 4.0

# Paper Trading
paper_trading:
  enabled: true
  simulate_fills: true
  simulated_slippage: 0.5

# Telegram Notifications
telegram:
  enabled: true
  notify_entry: true
  notify_exit: true
  notify_sl_hit: true
  notify_daily_summary: true
  notify_errors: true

# VWAP + PDH/PDL Fusion Strategy Configuration
# =====================================================
# 🎯 HIGH PROBABILITY BREAKOUT WITH VWAP CONFIRMATION 🎯
# =====================================================

strategy:
  name: "VWAP + PDH/PDL Fusion"
  version: "2.0.0"
  
  # Entry parameters
  entry:
    vwap_buffer: 5               # Points above/below VWAP for bias
    pdhl_buffer: 5               # Breakout buffer for PDH/PDL
    vwap_stability: 3            # Consecutive candles to confirm VWAP bias
    sl_type: "conservative"      # 'conservative' (PDH/PDL) or 'aggressive' (midpoint)
    atr_sl_multiplier: 0.5       # ATR-based SL multiplier (~10-12 points)
    min_rr_ratio: 1.5            # Minimum 1:1.5 Risk:Reward
    target_rr_1: 1.5             # First target R:R (exit 50%)
    target_rr_2: 2.5             # Second target R:R (exit remaining)
    max_trades_per_day: 3        # Max trades per day
    max_daily_loss_pct: 2.0      # Max 2% daily loss
    multi_breakout: true         # Allow re-entry after exit on same level
    cooldown_candles: 15         # Wait 15 candles (15 min) after exit before re-entry
    
  # Trading windows  
  trading_hours:
    entry_start: "09:30"         # Wait 15 min after open (let market settle)
    best_window_end: "11:30"     # Morning momentum window
    entry_end: "15:00"           # No new trades after 3 PM
    no_new_trades_after: "15:00" # Cutoff for new entries
    
  # Regime detection parameters
  regime:
    atr_period: 14               # ATR calculation period
    lookback: 20                 # Candles for regime detection
    ema_fast: 8                  # Fast EMA for direction
    ema_slow: 21                 # Slow EMA for direction
    
  # VWAP settings
  vwap:
    band_multiplier: 1.0         # Upper/Lower band = VWAP ± 1σ
    
  # Market Structure (PDH/PDL)
  market_structure:
    swing_lookback: 5            # Candles for swing detection
    atr_period: 14               # ATR for level calculations
    # Option to fetch previous day levels from API (set false to use only today's data)
    fetch_prev_day_from_api: false  # Use API to get yesterday's H/L/C
    # If fetch_prev_day_from_api is false AND fallbacks are 0, uses opening range
    fallback_pdh: 0              # Set to 0 to use today's opening range
    fallback_pdl: 0              # Set to 0 to use today's opening range  
    fallback_pdc: 0              # Set to 0 to use today's opening range
    use_opening_range: true      # Use first 15 min (9:15-9:30) High/Low as levels
    # Dynamic PDH/PDL - uses rolling high/low of last N candles
    dynamic_levels: false        # Disabled - use static PDH/PDL with multi-breakout instead
    dynamic_lookback: 60         # Rolling window in candles (not used when dynamic_levels=false)

# Index Configuration
index:
  symbol: "NIFTY"
  token: "99926000"              # NIFTY 50 Index token
  exchange: "NSE"
  exchange_type: 1               # NSE_CM

# Option Configuration
option:
  underlying: "NIFTY"
  exchange: "NFO"
  exchange_type: 2               # NSE_FO
  expiry_preference: "weekly"
  trade_direction: "BOTH"        # CE and PE both

# Strike Selection
strike_selection:
  premium_min: 85.0              # Minimum premium ₹85
  premium_max: 150.0             # Maximum premium ₹150
  premium_sweet_min: 90.0        # Sweet spot ₹90-120
  premium_sweet_max: 120.0
  strike_range: 5                # Check ±5 strikes from ATM

# Risk Management
risk:
  lot_size: 65                   # NIFTY lot = 65 qty
  num_lots: 4                    # Conservative: 4 lots
  fixed_quantity: 260            # 65 × 4
  margin_per_lot: 8000.0         # ₹8,000 margin per lot
  
  # Daily limits
  max_sl_per_day: 2              # Max 2 SL hits per day
  max_daily_loss: 4000           # Max ₹4,000 daily loss
  max_daily_loss_pct: 5.0        # Max 5% of capital
  max_trades_per_day: 4          # Max 4 trades (was 3)
  
  # Cooldown
  cooldown_candles: 15           # Wait 15 candles after trade
  
  # Capital
  paper_capital: 50000           # ₹50,000 paper trading

# Exit Rules
exit:
  # ATR-based SL (from strategy)
  use_atr_sl: true               # Use ATR-based dynamic SL
  atr_sl_multiplier: 1.0         # SL = Entry - (1 × ATR)
  
  # Trailing Stop Loss
  trailing:
    enabled: true
    safe_mode_trigger: 7.0       # At +7pt, move SL to entry+1
    safe_mode_buffer: 1.0
    trail_mode_trigger: 10.0     # At +10pt, start trailing
    trail_mode_buffer: 5.0       # TSL = High - 5pt

# Timing
timing:
  market_open: "09:15"
  market_close: "15:30"
  trading_start: "09:30"
  no_new_trades_after: "14:30"
  auto_logout: true
  logout_time: "15:35"

# Logging
logging:
  level: "INFO"
  format: "structured"
  log_dir: "logs"

# API Rate Limits (Angel One)
rate_limits:
  orders_per_second: 9
  position_poll_interval: 5
  websocket_heartbeat: 30
  market_feed_interval: 4.0

# Paper Trading
paper_trading:
  enabled: true
  simulate_fills: true
  simulated_slippage: 0.5

# Telegram Notifications
telegram:
  enabled: true
  notify_entry: true
  notify_exit: true
  notify_sl_hit: true
  notify_daily_summary: true
  notify_errors: true
